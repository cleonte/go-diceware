version: 2

before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/diceware
    binary: diceware
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # main.version is set by GoReleaser's default ldflags; it is what
    # `diceware --version` prints.
archives:
  - name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - NOTICE*
      - README*
      - CHANGELOG*
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
# The body of a release is its section of CHANGELOG.md (the release workflow
# passes it with --release-notes). The generated changelog below is only what a
# tag without a section gets.
release:
  footer: |
    ## Install

    `go install github.com/cleonte/go-diceware/cmd/diceware@{{ .Tag }}`, `brew install cleonte/tap/diceware` (macOS), or download the archive for your system below and put `diceware` on your PATH.

# The Homebrew cask in the tap cleonte/homebrew-tap (brew install cleonte/tap/diceware).
# A cask, because GoReleaser deprecated formulas for pre-built binaries (v2.10).
# The binaries are not signed or notarized, so the cask removes the quarantine
# flag that macOS puts on downloads; that is what stops Gatekeeper from refusing
# the first run. The token is a personal access token with write access to the tap
# only: the GITHUB_TOKEN of a workflow cannot push to another repository.
homebrew_casks:
  - name: diceware
    repository:
      owner: cleonte
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/cleonte/go-diceware
    description: "Diceware passphrase generator with English and Romanian wordlists"
    license: MIT
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/diceware"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

